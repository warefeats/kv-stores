services:
  engine:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.40.1
    command: >
      dragonfly
      --logtostderr
      --maxmemory 1073741824
      --cache_mode
      --proactor_threads 4
      --dbfilename ""
      --port 6379
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6379'"]
      interval: 2s
      timeout: 5s
      retries: 10
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G

  client:
    build:
      context: ..
      dockerfile: Dockerfile.memtier
    depends_on:
      engine:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 1G
