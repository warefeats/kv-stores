AWSTemplateFormatVersion: "2010-09-09"
Description: GitHub OIDC deploy role for warefeats/kv-stores

Parameters:
  GitHubOrganization:
    Type: String
    Default: warefeats
  GitHubRepository:
    Type: String
    Default: kv-stores
  RepositoryId:
    Type: String
    Description: Numeric GitHub repository ID (gh api repos/warefeats/kv-stores --jq .id)
  OrgId:
    Type: String
    Default: "322872963"
    Description: Numeric GitHub organization ID

Conditions:
  CreateOidcProvider: !Equals
    - !Ref "AWS::StackName"
    - "NEVER_CREATE"

Resources:
  OidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: kv-stores-github-deploy
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOrganization}/${GitHubRepository}:*"
                  - !Sub "repo:${OrgId}:${RepositoryId}:*"
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: kv-bench-operations
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: LaunchTaggedInstances
                Effect: Allow
                Action:
                  - ec2:RunInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    aws:RequestTag/Project: kv-bench
              - Sid: ManageTaggedInstances
                Effect: Allow
                Action:
                  - ec2:TerminateInstances
                  - ec2:StopInstances
                Resource: "*"
                Condition:
                  StringEquals:
                    ec2:ResourceTag/Project: kv-bench
              - Sid: DescribeCompute
                Effect: Allow
                Action:
                  - ec2:DescribeInstances
                  - ec2:DescribeInstanceStatus
                  - ec2:DescribeLaunchTemplates
                  - ec2:DescribeLaunchTemplateVersions
                  - ec2:DescribeAvailabilityZones
                  - ec2:DescribeSubnets
                Resource: "*"
              - Sid: SSMOrchestration
                Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                  - ssm:DescribeInstanceInformation
                Resource: "*"
              - Sid: UploadBenchResults
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub "arn:aws:s3:::warefeats-kv-bench-results-${AWS::AccountId}/*"
              - Sid: DescribeStacks
                Effect: Allow
                Action:
                  - cloudformation:DescribeStacks
                Resource: !Sub "arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/WarefeatsKvBench/*"
              - Sid: PassBenchInstanceRole
                Effect: Allow
                Action: iam:PassRole
                Resource: !Sub "arn:aws:iam::${AWS::AccountId}:role/WarefeatsKvBench-*"

Outputs:
  RoleArn:
    Value: !GetAtt DeployRole.Arn
