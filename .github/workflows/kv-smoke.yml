name: KV smoke test

on:
  pull_request:
    branches: [main]

jobs:
  # The smoke is a required check on main. It covers the runner, its compose files, the memtier image and this
  # workflow, so a PR that touches none of them skips it, and a skipped required check counts as passed: doc and
  # data PRs still merge, and a runner PR can't merge before the smoke has run and passed.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      runner: ${{ steps.files.outputs.runner }}
    steps:
      - name: List the PR's files
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FILES=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate --jq '.[].filename')
          if printf '%s\n' "$FILES" | grep -qE '^(src/|compose/|Dockerfile\.memtier$|\.github/workflows/kv-smoke\.yml$)'; then
            echo "runner=true" >> "$GITHUB_OUTPUT"
          else
            echo "runner=false" >> "$GITHUB_OUTPUT"
            echo "no runner file changed; the smoke is skipped"
          fi

  smoke:
    needs: changes
    if: needs.changes.outputs.runner == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Check cloud compose config
        run: |
          set -euo pipefail
          for ENGINE in redis valkey dragonfly kividb; do
            echo "--- ${ENGINE}"
            FILES="-f compose/docker-compose.${ENGINE}.yml -f compose/cloud-overlay.yml -f compose/cloud-${ENGINE}.yml"
            ENGINE_THREADS=64 docker compose ${FILES} config
            ENGINE_THREADS=64 docker compose ${FILES} config --format json > /tmp/cloud-config.json
            jq -e '.services.engine
              | .network_mode == "host"
                and (.security_opt | index("seccomp=./seccomp-io-uring.json")) != null
                and (.ulimits.memlock | if type == "number" then . else .single end) == -1' /tmp/cloud-config.json > /dev/null \
              || { echo "FAIL: ${ENGINE} cloud config lacks host networking, the seccomp profile or unlimited memlock"; exit 1; }
          done

      - name: Check io_uring under the cloud seccomp profile
        run: |
          set -euo pipefail
          echo "kernel.io_uring_disabled = $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo n/a)"
          for ENGINE in dragonfly kividb; do
            FILES="-f compose/docker-compose.${ENGINE}.yml -f compose/cloud-overlay.yml"
            docker compose ${FILES} -p kv-uring-${ENGINE} up -d engine
            LOGS=""
            for i in $(seq 1 60); do
              LOGS=$(docker compose ${FILES} -p kv-uring-${ENGINE} logs --no-color engine)
              grep -q -E "listening on|Ready to accept" <<< "$LOGS" && break
              sleep 1
            done
            docker compose ${FILES} -p kv-uring-${ENGINE} down -v --remove-orphans
            echo "--- ${ENGINE}"
            grep -E "I/O model|IORing|io_uring|epoll|io threads|Worker threads" <<< "$LOGS" || true
            if grep -q -E "Switching to epoll|io_uring unavailable" <<< "$LOGS"; then
              echo "FAIL: ${ENGINE} fell back from io_uring under the cloud seccomp profile"
              exit 1
            fi
            if [ "$ENGINE" = "kividb" ] && ! grep -q -E "I/O model +: io_uring" <<< "$LOGS"; then
              echo "FAIL: kividb did not report io_uring as its I/O model"
              exit 1
            fi
          done

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run smoke
        run: bun run src/run.ts --smoke --output=/tmp/smoke-results.json

      - name: Assert invariants
        run: |
          set -euo pipefail
          RESULTS=/tmp/smoke-results.json

          RESULT_COUNT=$(jq '.resultCount' "$RESULTS")
          FAILURE_COUNT=$(jq '.failureCount' "$RESULTS")
          echo "results: $RESULT_COUNT, failures: $FAILURE_COUNT"

          if [ "$RESULT_COUNT" -lt 20 ]; then
            echo "FAIL: expected >= 20 results (4 engines x 5 workloads), got $RESULT_COUNT"
            exit 1
          fi

          if [ "$FAILURE_COUNT" -ne 0 ]; then
            echo "FAIL: $FAILURE_COUNT failures"
            jq '.failures' "$RESULTS"
            exit 1
          fi

          # All throughput results must have ops/sec > 0
          ZERO_OPS=$(jq '[.results[] | select(.workload | startswith("memory-load") | not) | select(.opsPerSec <= 0)] | length' "$RESULTS")
          if [ "$ZERO_OPS" -gt 0 ]; then
            echo "FAIL: $ZERO_OPS results with zero ops/sec"
            exit 1
          fi

          # All results must have p99 > 0
          ZERO_P99=$(jq '[.results[] | select(.workload | startswith("memory-load") | not) | select(.p99Ms <= 0)] | length' "$RESULTS")
          if [ "$ZERO_P99" -gt 0 ]; then
            echo "FAIL: $ZERO_P99 results with zero p99"
            exit 1
          fi

          # Both memory cells must have run for every engine, each reporting its key count
          MEM_CELLS=$(jq '[.results[] | select(.workload | startswith("memory-load"))] | length' "$RESULTS")
          if [ "$MEM_CELLS" -ne 8 ]; then
            echo "FAIL: expected 8 memory cells (4 engines x ASCII and random bytes), got $MEM_CELLS"
            exit 1
          fi
          NO_KEYS=$(jq '[.results[] | select(.workload | startswith("memory-load")) | select(.engineStats.keyCount <= 0)] | length' "$RESULTS")
          if [ "$NO_KEYS" -gt 0 ]; then
            echo "FAIL: $NO_KEYS memory cells with zero key count"
            exit 1
          fi

          # GET-bearing workloads must have hit ratio >= 99%
          LOW_HIT=$(jq '[.results[] | select(.workload | startswith("memory-load") | not) | select(.engineStats.hitRatio < 0.99)] | length' "$RESULTS")
          if [ "$LOW_HIT" -gt 0 ]; then
            echo "FAIL: $LOW_HIT results with hit ratio < 99%"
            jq '[.results[] | select(.workload | startswith("memory-load") | not) | {label, hitRatio: .engineStats.hitRatio}]' "$RESULTS"
            exit 1
          fi

          echo "all invariants passed"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-results
          path: /tmp/smoke-results.json
