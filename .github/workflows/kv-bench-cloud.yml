name: KV cloud benchmark

on:
  workflow_dispatch:
    inputs:
      engine_type:
        description: "Engine to benchmark (all, redis, valkey, dragonfly)"
        required: false
        default: "all"
      matrix:
        description: "Matrix size (smoke, full)"
        required: false
        default: "full"
      region:
        description: "AWS region"
        required: false
        default: "us-east-1"

concurrency:
  group: kv-bench-cloud
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  STACK_NAME: WarefeatsKvBench
  PROJECT_TAG: kv-bench

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region }}
          role-duration-seconds: 7200

      - name: Read CDK outputs
        id: outputs
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' \
            | jq -r '.[] | "\(.OutputKey)=\(.OutputValue)"' >> "$GITHUB_OUTPUT"

      - name: Find AZ with capacity
        id: az
        run: |
          set -euo pipefail
          AZ=$(aws ec2 describe-availability-zones --region "${{ inputs.region }}" \
            --query 'AvailabilityZones[?State==`available`].ZoneName' --output text | tr '\t' '\n' | head -1)
          echo "az=$AZ" >> "$GITHUB_OUTPUT"

      - name: Launch instances
        id: launch
        run: |
          set -euo pipefail
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=availability-zone,Values=${{ steps.az.outputs.az }}" "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)

          ENGINE_ID=$(aws ec2 run-instances \
            --launch-template LaunchTemplateId=${{ steps.outputs.outputs.EngineLtId }} \
            --subnet-id "$SUBNET" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=kv-bench-engine},{Key=Project,Value=$PROJECT_TAG}]" \
            --query 'Instances[0].InstanceId' --output text)

          CLIENT_ID=$(aws ec2 run-instances \
            --launch-template LaunchTemplateId=${{ steps.outputs.outputs.ClientLtId }} \
            --subnet-id "$SUBNET" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=kv-bench-client},{Key=Project,Value=$PROJECT_TAG}]" \
            --query 'Instances[0].InstanceId' --output text)

          echo "engine_id=$ENGINE_ID" >> "$GITHUB_OUTPUT"
          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "launched engine=$ENGINE_ID client=$CLIENT_ID"

      - name: Wait for SSM readiness
        run: |
          set -euo pipefail
          for ID in ${{ steps.launch.outputs.engine_id }} ${{ steps.launch.outputs.client_id }}; do
            echo "waiting for $ID..."
            for i in $(seq 1 60); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=$ID" \
                --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
              [ "$STATUS" = "Online" ] && break
              sleep 10
            done
            [ "$STATUS" != "Online" ] && { echo "FAIL: $ID not SSM-ready"; exit 1; }
            echo "$ID is SSM-ready"
          done

      - name: Get engine IP
        id: engine_ip
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances --instance-ids ${{ steps.launch.outputs.engine_id }} \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Run benchmark
        run: |
          set -euo pipefail
          ENGINES="${{ inputs.engine_type }}"
          [ "$ENGINES" = "all" ] && ENGINES="redis valkey dragonfly"
          SMOKE_FLAG=""
          [ "${{ inputs.matrix }}" = "smoke" ] && SMOKE_FLAG="--smoke"

          for ENGINE in $ENGINES; do
            echo "=== benchmarking $ENGINE ==="

            # Start engine on engine instance
            aws ssm send-command \
              --instance-ids ${{ steps.launch.outputs.engine_id }} \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[
                \"cd /opt/bench\",
                \"docker compose -f compose/docker-compose.${ENGINE}.yml -p kv-${ENGINE} down -v --remove-orphans 2>/dev/null || true\",
                \"docker compose -f compose/docker-compose.${ENGINE}.yml -f compose/cloud-overlay.yml -p kv-${ENGINE} up -d engine --wait --wait-timeout 120\"
              ]" \
              --timeout-seconds 300 \
              --output text --query 'Command.CommandId' | xargs -I{} bash -c '
                for i in $(seq 1 60); do
                  S=$(aws ssm get-command-invocation --command-id {} --instance-id ${{ steps.launch.outputs.engine_id }} --query Status --output text 2>/dev/null || echo Pending)
                  [ "$S" = "Success" ] && break
                  [ "$S" = "Failed" ] && { echo "engine start failed"; exit 1; }
                  sleep 5
                done'

            # Run benchmark on client instance
            aws ssm send-command \
              --instance-ids ${{ steps.launch.outputs.client_id }} \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[
                \"export ENGINE_HOST=${{ steps.engine_ip.outputs.ip }}\",
                \"export CLOUD_MODE=1\",
                \"cd /opt/bench\",
                \"bun run src/run.ts --engine=${ENGINE} ${SMOKE_FLAG} --output=/tmp/results-${ENGINE}.json\",
                \"aws s3 cp /tmp/results-${ENGINE}.json s3://${{ steps.outputs.outputs.ResultsBucketName }}/$(date +%Y-%m-%d)/${ENGINE}.json\"
              ]" \
              --timeout-seconds 3600 \
              --output text --query 'Command.CommandId' | xargs -I{} bash -c '
                for i in $(seq 1 120); do
                  S=$(aws ssm get-command-invocation --command-id {} --instance-id ${{ steps.launch.outputs.client_id }} --query Status --output text 2>/dev/null || echo Pending)
                  [ "$S" = "Success" ] && break
                  [ "$S" = "Failed" ] && { echo "benchmark failed"; exit 1; }
                  sleep 30
                done'

            # Stop engine
            aws ssm send-command \
              --instance-ids ${{ steps.launch.outputs.engine_id }} \
              --document-name "AWS-RunShellScript" \
              --parameters commands="[\"cd /opt/bench && docker compose -f compose/docker-compose.${ENGINE}.yml -p kv-${ENGINE} down -v --remove-orphans\"]" \
              --timeout-seconds 120 \
              --output text > /dev/null
          done

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kv-bench-results
          path: /tmp/results-*.json
          if-no-files-found: ignore

      - name: Terminate instances
        if: always()
        run: |
          set -euo pipefail
          aws ec2 terminate-instances \
            --instance-ids ${{ steps.launch.outputs.engine_id }} ${{ steps.launch.outputs.client_id }} \
            2>/dev/null || true
          echo "instances terminated"

      - name: Reap stale instances
        if: always()
        run: |
          set -euo pipefail
          STALE=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=$PROJECT_TAG" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[?LaunchTime<='$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-3H +%Y-%m-%dT%H:%M:%S)'].InstanceId" \
            --output text 2>/dev/null || echo "")
          if [ -n "$STALE" ] && [ "$STALE" != "None" ]; then
            echo "reaping stale instances: $STALE"
            aws ec2 terminate-instances --instance-ids $STALE
          fi
