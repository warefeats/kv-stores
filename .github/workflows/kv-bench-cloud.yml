name: KV cloud benchmark

on:
  workflow_dispatch:
    inputs:
      engine_type:
        description: "Engine to benchmark (all, redis, valkey, dragonfly)"
        required: false
        default: "all"
      matrix:
        description: "Matrix size (smoke, full)"
        required: false
        default: "smoke"
        type: choice
        options:
          - smoke
          - full
      engine_threads:
        description: "Dragonfly proactor threads (matches engine vCPU count)"
        required: false
        default: "64"
      client_type:
        description: "Client EC2 instance type"
        required: false
        default: "c7g.4xlarge"
      memtier_threads:
        description: "Memtier benchmark threads (empty = auto: nproc - 2)"
        required: false
        default: ""
      region:
        description: "AWS region"
        required: false
        default: "us-east-1"

concurrency:
  group: kv-bench-cloud
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  packages: read

env:
  STACK_NAME: WarefeatsKvBench
  PROJECT_TAG: kv-bench

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    environment: kv-bench
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ inputs.region || 'us-east-1' }}
          role-duration-seconds: 7200

      - name: Read CDK outputs
        id: outputs
        run: |
          set -euo pipefail
          aws cloudformation describe-stacks --stack-name "$STACK_NAME" --query 'Stacks[0].Outputs' \
            | jq -r '.[] | "\(.OutputKey)=\(.OutputValue)"' >> "$GITHUB_OUTPUT"

      - name: Find AZ with engine capacity
        id: az
        run: |
          set -euo pipefail
          # A cluster placement group is bound to one AZ once anything has launched in it
          # (terminated instances keep it bound for a while), so prefer that AZ.
          PG=$(aws ec2 describe-launch-template-versions \
            --launch-template-id "${{ steps.outputs.outputs.EngineLtId }}" --versions '$Latest' \
            --query 'LaunchTemplateVersions[0].LaunchTemplateData.Placement.GroupName' --output text)
          PG_AZ=$(aws ec2 describe-instances \
            --filters "Name=placement-group-name,Values=${PG}" \
            --query 'Reservations[].Instances[].Placement.AvailabilityZone' --output text \
            | tr '\t' '\n' | grep -v '^$' | sort -u | head -n1 || true)
          OFFERED=$(aws ec2 describe-instance-type-offerings \
            --location-type availability-zone \
            --filters "Name=instance-type,Values=c7g.metal" \
            --query 'InstanceTypeOfferings[].Location' --output text | tr '\t' '\n' | sort)
          if [ -n "${PG_AZ}" ] && echo "${OFFERED}" | grep -qx "${PG_AZ}"; then
            AZ="${PG_AZ}"
          else
            AZ=$(echo "${OFFERED}" | head -n1)
          fi
          echo "placement group ${PG} → AZ ${AZ}"
          SUBNET=$(aws ec2 describe-subnets \
            --filters "Name=availability-zone,Values=${AZ}" "Name=default-for-az,Values=true" \
            --query 'Subnets[0].SubnetId' --output text)
          echo "az=$AZ" >> "$GITHUB_OUTPUT"
          echo "subnet=$SUBNET" >> "$GITHUB_OUTPUT"

      - name: Launch instances
        id: launch
        run: |
          set -euo pipefail
          RUN_ID="kv-bench-$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_NUMBER}"
          echo "run_id=${RUN_ID}" >> "$GITHUB_OUTPUT"

          ENGINE_ID=$(aws ec2 run-instances \
            --launch-template "LaunchTemplateId=${{ steps.outputs.outputs.EngineLtId }},Version=\$Latest" \
            --subnet-id "${{ steps.az.outputs.subnet }}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${RUN_ID}-engine},{Key=Project,Value=$PROJECT_TAG}]" \
            --query 'Instances[0].InstanceId' --output text)
          echo "engine_id=$ENGINE_ID" >> "$GITHUB_OUTPUT"

          CLIENT_ID=$(aws ec2 run-instances \
            --launch-template "LaunchTemplateId=${{ steps.outputs.outputs.ClientLtId }},Version=\$Latest" \
            --instance-type "${{ inputs.client_type }}" \
            --subnet-id "${{ steps.az.outputs.subnet }}" \
            --tag-specifications "ResourceType=instance,Tags=[{Key=Name,Value=${RUN_ID}-client},{Key=Project,Value=$PROJECT_TAG}]" \
            --query 'Instances[0].InstanceId' --output text)

          echo "client_id=$CLIENT_ID" >> "$GITHUB_OUTPUT"
          echo "launched engine=$ENGINE_ID client=$CLIENT_ID"

      - name: Wait for SSM readiness
        run: |
          set -euo pipefail
          wait_ssm() {
            local ID=$1
            for _ in $(seq 1 60); do
              STATUS=$(aws ssm describe-instance-information \
                --filters "Key=InstanceIds,Values=${ID}" \
                --query 'InstanceInformationList[0].PingStatus' --output text 2>/dev/null || echo "None")
              if [ "$STATUS" = "Online" ]; then return 0; fi
              sleep 10
            done
            echo "SSM timeout for ${ID}" >&2; return 1
          }
          wait_ssm ${{ steps.launch.outputs.engine_id }}
          wait_ssm ${{ steps.launch.outputs.client_id }}

      - name: Collect instance metadata
        id: meta
        run: |
          set -euo pipefail
          AMI=$(aws ec2 describe-instances --instance-ids ${{ steps.launch.outputs.engine_id }} \
            --query 'Reservations[0].Instances[0].ImageId' --output text)
          echo "ami=$AMI" >> "$GITHUB_OUTPUT"

      - name: Get engine IP
        id: engine_ip
        run: |
          set -euo pipefail
          IP=$(aws ec2 describe-instances --instance-ids ${{ steps.launch.outputs.engine_id }} \
            --query 'Reservations[0].Instances[0].PrivateIpAddress' --output text)
          echo "ip=$IP" >> "$GITHUB_OUTPUT"

      - name: Run benchmark
        env:
          ENGINE_ID: ${{ steps.launch.outputs.engine_id }}
          CLIENT_ID: ${{ steps.launch.outputs.client_id }}
          ENGINE_IP: ${{ steps.engine_ip.outputs.ip }}
          ENGINE_THREADS: ${{ inputs.engine_threads }}
          MEMTIER_THREADS: ${{ inputs.memtier_threads }}
          BUCKET: ${{ steps.outputs.outputs.ResultsBucketName }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          ssm_run() {
            local INSTANCE=$1; shift
            local CMD_ID
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 3600 \
              --parameters "{\"commands\":[\"export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\nset -e\n$*\"]}" \
              --query 'Command.CommandId' --output text)
            echo "  SSM command ${CMD_ID} on ${INSTANCE}"
            for _ in $(seq 1 360); do
              STATUS=$(aws ssm get-command-invocation \
                --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              case "$STATUS" in
                Success) return 0 ;;
                Failed|TimedOut|Cancelled)
                  echo "SSM command $STATUS on $INSTANCE" >&2
                  aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                    --query '[StandardOutputContent,StandardErrorContent]' --output text >&2
                  return 1 ;;
              esac
              sleep 10
            done
            echo "SSM polling exhausted for $INSTANCE" >&2
            return 1
          }

          ENGINES="${{ inputs.engine_type }}"
          [ "$ENGINES" = "all" ] && ENGINES="redis valkey dragonfly"
          SMOKE_FLAG=""
          [ "${{ inputs.matrix }}" = "smoke" ] && SMOKE_FLAG="--smoke"

          # User data (docker, bun, repo clone) may still be running when SSM first reports Online.
          for ID in "$ENGINE_ID" "$CLIENT_ID"; do
            ssm_run "$ID" "for i in \$(seq 1 90); do if [ -x /usr/bin/docker ] && [ -x /usr/local/bin/bun ] && [ -d /opt/bench/node_modules ]; then exit 0; fi; sleep 10; done; echo user data not finished >&2; tail -n 40 /var/log/cloud-init-output.log >&2; exit 1"
          done

          # Log in to GHCR on client for memtier image
          ssm_run "$CLIENT_ID" \
            "echo ${GHCR_TOKEN} | docker login ghcr.io -u x --password-stdin && docker pull ghcr.io/warefeats/memtier-benchmark:2.5.1"

          for ENGINE in $ENGINES; do
            echo "=== benchmarking $ENGINE ==="

            COMPOSE_FILES="-f compose/docker-compose.${ENGINE}.yml -f compose/cloud-overlay.yml -f compose/cloud-${ENGINE}.yml"

            # Start engine on engine instance
            ssm_run "$ENGINE_ID" \
              "cd /opt/bench && ENGINE_THREADS=${ENGINE_THREADS} docker compose ${COMPOSE_FILES} -p kv-${ENGINE} up -d engine --wait --wait-timeout 120"

            ENGINE_IMG=$(grep -m1 '^\s*image:' compose/docker-compose.${ENGINE}.yml | awk '{print $2}')

            # Run benchmark on client instance
            ssm_run "$CLIENT_ID" \
              "cd /opt/bench && ENGINE_HOST=${ENGINE_IP} CLOUD_MODE=1 ENGINE_IMAGE=${ENGINE_IMG} MEMTIER_THREADS=${MEMTIER_THREADS} MEMTIER_IMAGE=ghcr.io/warefeats/memtier-benchmark:2.5.1 bun run src/run.ts --engine=${ENGINE} ${SMOKE_FLAG} --resume --output=/tmp/results.json"

            # Stop engine
            ssm_run "$ENGINE_ID" \
              "cd /opt/bench && docker compose ${COMPOSE_FILES} -p kv-${ENGINE} down -v --remove-orphans" || true
          done

      - name: Collect results
        if: always() && steps.launch.outputs.client_id != ''
        env:
          CLIENT_ID: ${{ steps.launch.outputs.client_id }}
          RUN_ID: ${{ steps.launch.outputs.run_id }}
          BUCKET: ${{ steps.outputs.outputs.ResultsBucketName }}
          CLIENT_TYPE: ${{ inputs.client_type }}
          ENGINE_THREADS: ${{ inputs.engine_threads }}
          AMI: ${{ steps.meta.outputs.ami }}
        run: |
          set -euo pipefail

          ssm_run() {
            local INSTANCE=$1; shift
            local CMD_ID
            CMD_ID=$(aws ssm send-command \
              --instance-ids "$INSTANCE" \
              --document-name AWS-RunShellScript \
              --timeout-seconds 120 \
              --parameters "{\"commands\":[\"export PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin\nset -e\n$*\"]}" \
              --query 'Command.CommandId' --output text)
            for _ in $(seq 1 30); do
              STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE" \
                --query 'Status' --output text 2>/dev/null || echo "Pending")
              case "$STATUS" in
                Success) return 0 ;;
                Failed|TimedOut|Cancelled) return 1 ;;
              esac
              sleep 5
            done
            return 1
          }

          # Copy results from client to S3
          ssm_run "$CLIENT_ID" \
            "aws s3 cp /tmp/results.json s3://${BUCKET}/bench-runs/${RUN_ID}/results.json" || true

          # Generate metadata on runner
          cat > /tmp/metadata.json <<METAEOF
          {
            "runId": "${RUN_ID}",
            "engineType": "c7g.metal",
            "clientType": "${CLIENT_TYPE}",
            "engineThreads": ${ENGINE_THREADS},
            "ami": "${AMI}",
            "region": "${{ inputs.region || 'us-east-1' }}",
            "matrix": "${{ inputs.matrix }}",
            "gitSha": "${GITHUB_SHA}",
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          METAEOF
          aws s3 cp /tmp/metadata.json "s3://${BUCKET}/bench-runs/${RUN_ID}/metadata.json"

          # Pull results back to runner for artifact
          mkdir -p /tmp/bench-output
          aws s3 cp "s3://${BUCKET}/bench-runs/${RUN_ID}/results.json" /tmp/bench-output/results.json || true
          cp /tmp/metadata.json /tmp/bench-output/metadata.json

      - name: Upload results artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kv-bench-results-${{ steps.launch.outputs.run_id }}
          path: /tmp/bench-output/
          retention-days: 90

      - name: Terminate instances
        if: always()
        run: |
          set -euo pipefail
          INSTANCES=""
          for id in "${{ steps.launch.outputs.engine_id }}" \
                    "${{ steps.launch.outputs.client_id }}"; do
            if [ -n "$id" ]; then INSTANCES="$INSTANCES $id"; fi
          done
          if [ -n "$INSTANCES" ]; then
            aws ec2 terminate-instances --instance-ids $INSTANCES || true
          fi

  reaper:
    name: Reap stale kv-bench instances
    runs-on: ubuntu-latest
    environment: kv-bench
    if: always()
    needs: benchmark
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ inputs.region || 'us-east-1' }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          role-session-name: kv-bench-reaper-${{ github.run_id }}
          role-duration-seconds: 7200

      - name: Terminate instances older than 3 hours
        run: |
          THREE_HOURS_AGO=$(date -u -d '3 hours ago' +%Y-%m-%dT%H:%M:%S 2>/dev/null || date -u -v-3H +%Y-%m-%dT%H:%M:%S)
          STALE=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=kv-bench" \
                      "Name=instance-state-name,Values=running,pending" \
            --query "Reservations[].Instances[?LaunchTime<='${THREE_HOURS_AGO}'].InstanceId" \
            --output text)
          if [ -n "$STALE" ] && [ "$STALE" != "None" ]; then
            echo "Terminating stale instances: $STALE"
            aws ec2 terminate-instances --instance-ids $STALE
          else
            echo "No stale instances found"
          fi
